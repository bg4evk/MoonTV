name: Sync Fork

on:
  schedule:
    - cron: "0 */* * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/Stardm0/MoonTV.git || true
          git fetch upstream

      # 恢复 workflow（避免被覆盖）
      - name: Backup workflows
        run: |
          mkdir -p backup_wf
          cp -r .github/workflows backup_wf/ || true

      # 强制同步 upstream/main 到本地 main
      - name: Hard Reset to Upstream
        run: |
          git checkout main
          git reset --hard upstream/main

      # 恢复你自己的 workflows
      - name: Restore workflows
        run: |
          mkdir -p .github/workflows
          cp -r backup_wf/workflows/. .github/workflows/ || true

      # 推送（加上 --force，确保不会被 non-fast-forward 卡住）
      - name: Push to origin
        run: |
          git add .
          git commit -m "Sync from upstream" || true
          git push origin main --force
