name: Sync Fork

on:
  schedule:
    - cron: "0 * * * *"   # 每小时自动同步
  workflow_dispatch:       # 支持手动执行

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/Stardm0/MoonTV.git || true
          git fetch upstream

      - name: Merge upstream -> main (ignore workflow files)
        run: |
          git checkout main
          git pull --rebase --strategy-option theirs upstream main

          # 删除上游的 workflow，避免 GitHub 拒绝推送
          rm -rf .github/workflows/*
